<mat-toolbar class="article-toolbar">
    <mat-toolbar-row class="custom-toolbar">
        <span class="dialog-title">
            Article
            <span class="published-date">Published on {{articleDetails.publication_date | date : 'dd-MM-yyyy'}}</span>
        </span>
        <span class="spacer"></span>
        <button class="mat-dialog-close" mat-icon-button mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </mat-toolbar-row>
</mat-toolbar>

<mat-dialog-content class="mat-typography">
    <h2 class="article-title">{{articleDetails.title}}</h2>
    <hr>
    <div class="article-body" [innerHTML]="articleDetails.content | sanitizeHtml"></div>
</mat-dialog-content>
