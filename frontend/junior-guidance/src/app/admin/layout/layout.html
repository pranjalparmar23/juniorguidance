<mat-toolbar class="custom-toolbar mat-elevation-z8">
    <button mat-icon-button (click)="sidenav.toggle()" class="hamburger">
        <mat-icon *ngIf="!sidenav.opened">menu</mat-icon>
        <mat-icon *ngIf="sidenav.opened">close</mat-icon>
    </button>
    Junior's Guidance
    <span class="spacer"></span>
    <button mat-icon-button (click)="logout()" class="logout-button">
        <mat-icon>exit_to_app</mat-icon>
    </button>
</mat-toolbar>

<mat-sidenav-container>
    <mat-sidenav #sidenav="matSidenav" [opened]="!isMobile" [mode]="isMobile ? 'over' : 'side'">
        <img class="avatar mat-elevation-z8" src="/profile.png" alt="Profile">

        <mat-divider class="custom-divider"></mat-divider>

        <button mat-button class="menu-button" routerLink="/articleHub/dashboard" routerLinkActive="active" (click)="closeMenuOnMobile(sidenav)">
            <mat-icon>home</mat-icon>
            <span>Dashboard</span>
        </button>

        <button *ngIf="isAdmin" mat-button class="menu-button" routerLink="/articleHub/users" routerLinkActive="active" (click)="closeMenuOnMobile(sidenav)">
            <mat-icon>group</mat-icon>
            <span>User</span>
        </button>

        <button mat-button class="menu-button" routerLink="/articleHub/category" routerLinkActive="active" (click)="closeMenuOnMobile(sidenav)">
            <mat-icon>apartment</mat-icon>
            <span>Category</span>
        </button>

        <button mat-button class="menu-button" routerLink="/articleHub/article" routerLinkActive="active" (click)="closeMenuOnMobile(sidenav)">
            <mat-icon>storage</mat-icon>
            <span>Article</span>
        </button>

        <mat-divider class="custom-divider"></mat-divider>

        <button mat-button class="menu-button" routerLink="/articleHub/help" routerLinkActive="active" (click)="closeMenuOnMobile(sidenav)">
            <mat-icon>help</mat-icon>
            <span>Help</span>
        </button>
    </mat-sidenav>

    <mat-sidenav-content>
        <div class="content mat-elevation-z8">
            <router-outlet></router-outlet>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
