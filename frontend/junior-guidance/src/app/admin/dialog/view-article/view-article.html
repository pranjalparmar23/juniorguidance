<mat-toolbar>
    <mat-toolbar-row class="custom-toolbar">
        <span class="title-center">View Article</span>
    </mat-toolbar-row>
</mat-toolbar>

<mat-dialog-content class="mat-typography">
    <div class="article-meta">
        <h2>{{article?.title}}</h2>
        <p>Category: {{article?.categoryName}}</p>
        <p>Status: {{article?.status}}</p>
    </div>
    <hr>

    <div class="article-body" [innerHTML]="article.content | sanitizeHtml"></div>
</mat-dialog-content>

<mat-dialog-actions align="center">
    <button mat-raised-button mat-dialog-close>Close</button>
</mat-dialog-actions>
