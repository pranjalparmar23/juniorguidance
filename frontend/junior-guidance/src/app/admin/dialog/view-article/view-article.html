<mat-toolbar>
    <mat-toolbar-row fxLayout="row" class="custom-toolbar">
        <span class="title-center">View Article</span>
    </mat-toolbar-row>
</mat-toolbar>

<mat-dialog-content class="mat-typography">
    <div style="color: black;">
        Title: {{article?.title}} <br>
        Category: {{article?.categoryName}} <br>
        Status: {{article?.status}}
    </div>
    <hr>

    <div [innerHTML]="article.content | sanitizeHtml"></div>
</mat-dialog-content>

<mat-dialog-actions align="center">
    <button mat-raised-button mat-dialog-close>Close</button>
</mat-dialog-actions>
